<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password · Run Green</title>
  <link rel="icon" href="assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Inter, sans-serif; background: linear-gradient(135deg,#effff3,#f7fffb); color: #111; }
    .card { width: min(100%,440px); padding: 40px; border: 1px solid #dce7df; border-radius: 24px; background: rgba(255,255,255,.94); box-shadow: 0 18px 60px rgba(0,0,0,.10); }
    .eyebrow { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; color: #17aa50; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #19ad50; box-shadow: 0 0 8px #19ad50; }
    h1 { margin: 0 0 8px; font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
    p { margin: 0 0 28px; color: #6c6d73; font-size: 14px; line-height: 1.6; }
    label { display: block; margin: 0 0 8px; color: #6c6d73; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
    input { width: 100%; margin-bottom: 16px; padding: 13px 16px; border: 1px solid #d8dce0; border-radius: 12px; background: #f8fffa; font: inherit; font-size: 15px; }
    button { margin-top: 6px; padding: 9px 18px; border: 0; border-radius: 999px; background: #19ad50; color: white; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .status { min-height: 24px; margin-top: 18px; color: #d33; }
    .status.success { color: #158842; }
    a { color: #159447; font-size: 14px; font-weight: 600; }
    .card > p:last-child { margin: 22px 0 0; }
    @media (max-width: 520px) { .card { padding: 28px 22px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Secure access</div>
    <h1>Choose a new password</h1>
    <p id="helper">Open this page from the password-reset email, then enter your new password.</p>
    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="6" autocomplete="new-password" required />
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required />
      <button id="saveButton" type="submit">Save new password</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <p><a href="/">Back to sign in</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const client = supabase.createClient(
      "https://wstnsrizuhzezectivwf.supabase.co",
      "sb_publishable_GE5PhqdYjJ3RCcXgkJxjeA_Ry9Oh-Oz"
    );
    const form = document.getElementById("resetForm");
    const status = document.getElementById("status");
    const button = document.getElementById("saveButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirmPassword").value;

      status.classList.remove("success");
      if (password.length < 6) {
        status.textContent = "Use at least 6 characters.";
        return;
      }
      if (password !== confirmation) {
        status.textContent = "The passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "Saving…";
      status.textContent = "";
      const { error } = await client.auth.updateUser({ password });
      button.disabled = false;
      button.textContent = "Save new password";

      if (error) {
        status.textContent = error.message;
        return;
      }

      status.classList.add("success");
      status.textContent = "Password updated. You can now sign in.";
      form.reset();
    });
  </script>
</body>
</html>
